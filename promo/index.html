<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Scan — 项目介绍</title>
<style>
  :root {
    --bg: #17201b;
    --ink: #eef3f0;
    --muted: #8fa398;
    --accent: #4cc38a;
    --accent-deep: #2f8f63;
    --paper: #f7f6f2;
    --mono: ui-monospace, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .stage {
    position: relative;
    width: min(920px, 94vw);
    height: min(560px, 90vh);
  }
  /* 重播按钮 */
  .replay {
    position: absolute;
    right: 0; bottom: -46px;
    border: 1px solid #3a4a41;
    background: transparent;
    color: var(--muted);
    font-size: .8rem;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .4s;
    font-family: inherit;
  }
  .replay.show { opacity: 1; }
  .replay:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- 通用场景 ---------- */
  .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    pointer-events: none;
  }
  .scene.on { opacity: 1; }
  .scene.off { opacity: 0; transform: translateY(-10px); transition: opacity .45s, transform .45s; }
  .scene .kicker {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .22em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0;
  }
  .scene.on .kicker { animation: fadeup .6s .1s forwards; }
  .scene h2 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -.01em;
    text-align: center;
    opacity: 0;
  }
  .scene.on h2 { animation: fadeup .6s .25s forwards; }
  .scene .sub {
    color: var(--muted);
    font-size: .92rem;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
  }
  .scene.on .sub { animation: fadeup .6s .4s forwards; }
  @keyframes fadeup {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Scene 1: 手机拍照，一道扫描光 ---------- */
  .s1 .phone {
    position: absolute;
    left: 50%; top: 50%;
    width: 54px; height: 96px;
    border-radius: 10px;
    background: #232e27;
    border: 1px solid #3a4a41;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  .s1.on .phone { animation: phoneIn .9s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes phoneIn {
    from { opacity: 0; transform: translate(-160px, -40px) rotate(-14deg); }
    to   { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg); }
  }
  .s1 .doc {
    position: absolute;
    left: 50%; top: 50%;
    width: 150px; height: 200px;
    border-radius: 6px;
    background: var(--paper);
    transform: translate(20px, -10px) rotate(3deg);
    opacity: 0;
    box-shadow: 0 14px 40px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .s1.on .doc { animation: docIn .9s .3s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes docIn {
    from { opacity: 0; transform: translate(60px, 30px) rotate(7deg) scale(.94); }
    to   { opacity: 1; transform: translate(20px, -10px) rotate(3deg) scale(1); }
  }
  /* 纸上的假文字行 */
  .s1 .doc i, .s2 .doc i, .s3 .doc i {
    display: block;
    height: 6px;
    margin: 10px 16px 0;
    border-radius: 3px;
    background: #d8d5cd;
  }
  .s1 .doc i:nth-child(1) { width: 55%; height: 12px; background: #a9b8a0; margin-top: 22px; }
  .s1 .doc i:nth-child(4), .s2 .doc i:nth-child(4), .s3 .doc i:nth-child(4) { width: 70%; }
  .s1 .doc i:nth-child(6), .s2 .doc i:nth-child(6), .s3 .doc i:nth-child(6) { width: 40%; }
  /* 扫描光扫过纸面 */
  .s1 .doc::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 100%;
    background: linear-gradient(180deg, transparent 0%, rgba(76,195,138,.28) 46%, rgba(76,195,138,.55) 50%, rgba(76,195,138,.28) 54%, transparent 100%);
    opacity: 0;
  }
  .s1.on .doc::after { animation: sweepDown 1.1s 1.2s ease-in-out forwards; }
  @keyframes sweepDown {
    0%   { opacity: 0; transform: translateY(-100%); }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(100%); }
  }
  .s1 .kicker { position: absolute; top: 8%; left: 0; right: 0; }
  .s1 h2, .s1 .sub { position: absolute; left: 0; right: 0; bottom: 6%; }

  /* ---------- Scene 2: 四角检测 + 透视校正 ---------- */
  .s2 .doc {
    position: absolute;
    left: 50%; top: 50%;
    width: 170px; height: 210px;
    border-radius: 6px;
    background: var(--paper);
    transform: translate(-50%, -50%) rotate(-2deg) skewX(-3deg);
    box-shadow: 0 14px 40px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .s2.on .doc { animation: straighten 1.3s .9s cubic-bezier(.3,.7,.2,1) forwards; }
  @keyframes straighten {
    to { transform: translate(-50%, -50%) rotate(0) skewX(0); }
  }
  /* 检测到的四个角点 */
  .s2 .corner {
    position: absolute;
    width: 14px; height: 14px;
    border: 2.5px solid var(--accent);
    opacity: 0;
  }
  .s2.on .corner { animation: cornerIn .4s forwards; }
  .s2 .corner.c1 { left: -7px;  top: -7px;    border-right: none; border-bottom: none; animation-delay: .15s; }
  .s2 .corner.c2 { right: -7px; top: -7px;    border-left: none;  border-bottom: none; animation-delay: .3s; }
  .s2 .corner.c3 { right: -7px; bottom: -7px; border-left: none;  border-top: none;    animation-delay: .45s; }
  .s2 .corner.c4 { left: -7px;  bottom: -7px; border-right: none; border-top: none;    animation-delay: .6s; }
  @keyframes cornerIn {
    from { opacity: 0; transform: scale(1.8); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* 连角们的描边框 */
  .s2 .quad {
    position: absolute;
    inset: 0;
    stroke: var(--accent);
    stroke-width: 2;
    fill: rgba(76,195,138,.06);
    opacity: 0;
  }
  .s2.on .quad { animation: quadIn .5s .75s forwards; }
  @keyframes quadIn { to { opacity: 1; } }
  .s2 .kicker { position: absolute; top: 8%; left: 0; right: 0; }
  .s2 h2, .s2 .sub { position: absolute; left: 0; right: 0; bottom: 6%; }

  /* ---------- Scene 3: 增强模式三连变 ---------- */
  .s3 .row {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 22px;
    align-items: center;
  }
  .s3 .doc {
    width: 130px; height: 172px;
    border-radius: 6px;
    background: var(--paper);
    box-shadow: 0 14px 40px rgba(0,0,0,.4);
    overflow: hidden;
    opacity: 0;
    position: relative;
  }
  .s3.on .doc { animation: docPop .55s forwards; }
  .s3.on .doc:nth-child(1) { animation-delay: .15s; }
  .s3.on .doc:nth-child(2) { animation-delay: .55s; }
  .s3.on .doc:nth-child(3) { animation-delay: .95s; }
  @keyframes docPop {
    from { opacity: 0; transform: translateY(24px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* 灰度 */
  .s3 .doc.gray i { filter: grayscale(1); background: #c4c4c4; }
  .s3 .doc.gray i:first-child { background: #8a8a8a; }
  /* 黑白 */
  .s3 .doc.bw i { background: #2a2a2a; filter: contrast(2.2) grayscale(1); }
  .s3 .doc.bw i:first-child { background: #111; }
  .s3 .tag {
    position: absolute;
    left: 0; right: 0; bottom: 8px;
    text-align: center;
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .12em;
    color: var(--muted);
    opacity: 0;
  }
  .s3.on .tag { animation: fadeIn .4s 1.2s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .s3 .kicker { position: absolute; top: 8%; left: 0; right: 0; }
  .s3 h2, .s3 .sub { position: absolute; left: 0; right: 0; bottom: 6%; }

  /* ---------- Scene 4: 页面飞入 A4 叠 + 下载 ---------- */
  .s4 .stack {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: 168px; height: 232px;
  }
  .s4 .page {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: var(--paper);
    box-shadow: 0 10px 34px rgba(0,0,0,.42);
    overflow: hidden;
    opacity: 0;
  }
  .s4 .page i { display: block; height: 5px; margin: 9px 14px 0; border-radius: 3px; background: #d8d5cd; }
  .s4 .page i:first-child { width: 50%; height: 10px; background: #a9b8a0; margin-top: 18px; }
  .s4 .page i:nth-child(3) { width: 65%; }
  .s4 .page i:nth-child(5) { width: 40%; }
  .s4.on .page { animation: pageFly .7s cubic-bezier(.2,.8,.3,1) forwards; }
  .s4.on .page:nth-child(1) { animation-delay: .2s; }
  .s4.on .page:nth-child(2) { animation-delay: .5s; }
  .s4.on .page:nth-child(3) { animation-delay: .8s; }
  @keyframes pageFly {
    from { opacity: 0; transform: translate(90px, -60px) rotate(8deg) scale(.9); }
    to   { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
  }
  /* PDF 徽章 */
  .s4 .pdfbadge {
    position: absolute;
    right: -46px; bottom: -10px;
    padding: 7px 14px;
    border-radius: 9px;
    background: var(--accent);
    color: #10231a;
    font-family: var(--mono);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    opacity: 0;
    box-shadow: 0 8px 26px rgba(76,195,138,.4);
  }
  .s4.on .pdfbadge { animation: badgeIn .5s 1.5s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes badgeIn {
    from { opacity: 0; transform: scale(.6) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .s4 .kicker { position: absolute; top: 8%; left: 0; right: 0; }
  .s4 h2, .s4 .sub { position: absolute; left: 0; right: 0; bottom: 6%; }

  /* ---------- Scene 5: 结尾 brand ---------- */
  .s5 { text-align: center; }
  .s5 .logo {
    width: 58px; height: 58px;
    border-radius: 15px;
    background: linear-gradient(160deg, var(--accent-deep), var(--accent));
    display: grid;
    place-items: center;
    color: #10231a;
    margin: 0 auto 20px;
    opacity: 0;
    box-shadow: 0 10px 30px rgba(76,195,138,.35);
  }
  .s5.on .logo { animation: logoIn .6s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(.5) rotate(-8deg); }
    to   { opacity: 1; transform: scale(1) rotate(0); }
  }
  .s5 h2 { font-size: clamp(2rem, 5.5vw, 3rem); }
  .s5 .sub { font-size: .95rem; }
  .s5 .chips {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 22px;
    opacity: 0;
  }
  .s5.on .chips { animation: fadeup .6s .8s forwards; }
  .s5 .chip {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    color: var(--muted);
    border: 1px solid #3a4a41;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .s5 .chip.hl { color: var(--accent); border-color: var(--accent-deep); }

  /* 底部进度条 */
  .progress {
    position: absolute;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    width: 180px; height: 2px;
    background: #2a372f;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 2px;
  }
  .progress.run i { animation: grow 15s linear forwards; }
  @keyframes grow { to { width: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .scene, .scene .kicker, .scene h2, .scene .sub,
    .s1 .phone, .s1 .doc, .s2 .corner, .s2 .quad,
    .s3 .doc, .s4 .page, .s4 .pdfbadge, .s5 .logo, .s5 .chips {
      animation-duration: .01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      animation-fill-mode: forwards !important;
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Scene 1 · 0-3s 拍照 -->
    <div class="scene s1" data-t="0" data-dur="3300">
      <div class="kicker">01 · 拍照</div>
      <div class="phone">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="margin:auto">
          <rect x="7" y="2.5" width="10" height="19" rx="2.5" stroke="#4cc38a" stroke-width="1.5"/>
          <circle cx="12" cy="18" r="1" fill="#4cc38a"/>
        </svg>
      </div>
      <div class="doc"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h2>随手一拍，就是扫描</h2>
      <p class="sub">手机照片 · 截图 · 粘贴，全都进同一台「扫描仪」</p>
    </div>

    <!-- Scene 2 · 3.3-6.6s 边缘检测 -->
    <div class="scene s2" data-t="3300" data-dur="3300">
      <div class="kicker">02 · 识别</div>
      <div class="doc">
        <i></i><i></i><i></i><i></i><i></i><i></i>
        <div class="corner c1"></div><div class="corner c2"></div>
        <div class="corner c3"></div><div class="corner c4"></div>
        <svg class="quad" viewBox="0 0 170 210"><path d="M2 2 L168 2 L168 208 L2 208 Z"/></svg>
      </div>
      <h2>找到纸的四个角</h2>
      <p class="sub">自动边缘检测 · 透视校正 · 外扩保护内容</p>
    </div>

    <!-- Scene 3 · 6.6-10s 增强 -->
    <div class="scene s3" data-t="6600" data-dur="3400">
      <div class="kicker">03 · 增强</div>
      <div class="row">
        <div class="doc"><i></i><i></i><i></i><i></i><i></i><i></i><span class="tag">COLOR</span></div>
        <div class="doc gray"><i></i><i></i><i></i><i></i><i></i><i></i><span class="tag">GRAY</span></div>
        <div class="doc bw"><i></i><i></i><i></i><i></i><i></i><i></i><span class="tag">B&amp;W</span></div>
      </div>
      <h2>像扫描仪一样干净</h2>
      <p class="sub">去阴影 · 提对比 · 彩色 / 灰度 / 黑白三种模式</p>
    </div>

    <!-- Scene 4 · 10-12.6s PDF -->
    <div class="scene s4" data-t="10000" data-dur="2600">
      <div class="kicker">04 · 导出</div>
      <div class="stack">
        <div class="page"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="page"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="page"><i></i><i></i><i></i><i></i><i></i><span class="pdfbadge">PDF · A4</span></div>
      </div>
      <h2>多页合一，一键 PDF</h2>
      <p class="sub">统一 A4 版面 · 逐页预览 · 直接下载</p>
    </div>

    <!-- Scene 5 · 12.6-15s 品牌 -->
    <div class="scene s5" data-t="12600" data-dur="2400">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect x="2" y="3.5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 6.5h9M4.5 9h9M4.5 11.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Document Scan</h2>
      <p class="sub">本地文档扫描仪 · 全程离线</p>
      <div class="chips">
        <span class="chip hl">100% 本地处理</span>
        <span class="chip">照片 / Word / PDF</span>
        <span class="chip">MCP · CLI · Web</span>
      </div>
    </div>

    <div class="progress" id="progress"><i></i></div>
    <button class="replay" id="replay">↺ 重播</button>
  </div>

<script>
  const scenes = [...document.querySelectorAll(".scene")];
  const progress = document.getElementById("progress");
  const replayBtn = document.getElementById("replay");
  const TOTAL = 15000;
  let timers = [];

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    scenes.forEach((s) => s.classList.remove("on", "off"));
    progress.classList.remove("run");
    replayBtn.classList.remove("show");
    // 强制 reflow 让动画从头播
    void progress.offsetWidth;
    progress.classList.add("run");

    scenes.forEach((s) => {
      const t = +s.dataset.t;
      timers.push(setTimeout(() => s.classList.add("on"), t));
      // 退场：留 .45s 淡出，与下一幕淡入交叠。
      timers.push(setTimeout(() => s.classList.add("off"), t + +s.dataset.dur));
    });
    timers.push(setTimeout(() => replayBtn.classList.add("show"), TOTAL - 600));
  }

  replayBtn.addEventListener("click", play);
  play();
</script>
</body>
</html>
