<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Scan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --success: #059669;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    header .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .35);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Drop zone */
    .drop {
      border: 2px dashed #c7d2fe;
      border-radius: 14px;
      margin: 20px;
      padding: 40px 24px;
      text-align: center;
      background: var(--accent-soft);
      transition: border-color .15s, background .15s, transform .15s;
      cursor: pointer;
      position: relative;
    }

    .drop.dragover {
      border-color: var(--accent);
      background: #dbeafe;
      transform: scale(1.01);
    }

    .drop.has-files {
      background: #fff;
      border-color: var(--border);
      border-style: solid;
      padding: 16px;
    }

    .drop-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: .85;
    }

    .drop h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .drop p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .drop input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-list {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      /* The transparent <input> above covers the whole zone; lifting the strip
         one level makes thumbnails clickable while the padding around them
         still opens the file picker. */
      position: relative;
      z-index: 1;
    }

    .drop.has-files .file-list { display: flex; }
    .drop.has-files .drop-hint { display: none; }

    .thumb {
      width: 88px;
      height: 112px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f3f4f6;
      cursor: zoom-in;
    }

    .thumb-wrap {
      position: relative;
    }

    .thumb-wrap .ord {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
    }

    /* Options */
    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 24px 8px;
    }

    @media (max-width: 560px) {
      .opts { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .seg {
      display: flex;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .seg button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all .12s;
      font-family: inherit;
    }

    .seg button.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .toggles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      padding-top: 4px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      appearance: none;
      width: 40px;
      height: 22px;
      border-radius: 999px;
      background: #d1d5db;
      position: relative;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }

    .toggle input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .15s;
    }

    .toggle input:checked {
      background: var(--accent);
    }

    .toggle input:checked::after {
      transform: translateX(18px);
    }

    /* Actions */
    .actions {
      padding: 20px 24px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s, transform .08s, opacity .12s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, .35);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      background: #f3f4f6;
    }

    .status {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status.working { color: var(--accent); }
    .status.ok { color: var(--success); }
    .status.err { color: #dc2626; }

    /* Result */
    .result {
      display: none;
      margin-top: 24px;
    }

    .result.show { display: block; }

    .result .card {
      padding: 20px 24px 24px;
    }

    .result h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result h3 span.badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: #ecfdf5;
      color: var(--success);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .preview-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
    }

    .preview-row img {
      height: 200px;
      width: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      cursor: zoom-in;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-download {
      background: var(--success);
      color: #fff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, .3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-download:hover {
      background: #047857;
    }

    #modeBadge {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pdf-view {
      display: block;
      width: 100%;
      height: 70vh;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f3f4f6;
    }

    .pdf-view[hidden] { display: none; }

    /* Image preview overlay */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 60px 84px;
      background: rgba(15, 18, 25, .86);
    }

    .lightbox.show { display: flex; }

    .lb-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
      max-height: 100%;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: calc(100vh - 170px);
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 56px rgba(0,0,0,.5);
    }

    .lb-stage figcaption {
      color: #d1d5db;
      font-size: 0.85rem;
    }

    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 68px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: background .12s;
    }

    .lb-btn:hover { background: rgba(255,255,255,.26); }
    .lb-btn[hidden] { display: none; }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }

    .lb-close {
      top: 18px;
      right: 18px;
      transform: none;
      width: 40px;
      height: 40px;
      font-size: 17px;
    }

    @media (max-width: 560px) {
      .lightbox { padding: 56px 10px; }
      .lb-btn { width: 36px; height: 54px; font-size: 22px; }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #bfdbfe;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <div class="logo-icon">📄</div>
        <h1>Document Scan</h1>
      </div>
      <p>本地扫描 · 透视校正 · 增强 · 导出 A4 PDF</p>
    </header>

    <div class="card">
      <div class="drop" id="dropzone">
        <input type="file" id="fileInput" accept="image/*" multiple />
        <div class="drop-hint">
          <div class="drop-icon">⬆️</div>
          <h2>拖放图片到这里</h2>
          <p>或点击选择 · Ctrl+V 粘贴截图 · 可分多次添加 · JPG / PNG / WEBP</p>
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <div class="opts">
        <div class="field">
          <label>扫描模式</label>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="color" class="active">彩色</button>
            <button type="button" data-mode="gray">灰度</button>
            <button type="button" data-mode="bw">黑白</button>
          </div>
        </div>
        <div class="field">
          <label>选项</label>
          <div class="toggles">
            <label class="toggle">
              <input type="checkbox" id="autoCrop" checked />
              <span>智能裁边（外扩保护内容）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="unifyA4" checked />
              <span>统一为 A4 页面</span>
            </label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btnScan" disabled>开始扫描</button>
        <button class="btn btn-ghost" id="btnClear" disabled>清空</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="result" id="result">
      <div class="card">
        <h3>处理完成 <span class="badge" id="pageBadge">0 页</span><span class="badge" id="modeBadge"></span></h3>
        <div class="preview-row" id="previewRow"></div>
        <div class="result-actions">
          <a class="btn btn-download" id="btnDownload" href="#" download>
            ↓ 下载 PDF
          </a>
          <button type="button" class="btn btn-ghost" id="btnPdf">预览 PDF</button>
          <button class="btn btn-ghost" id="btnAgain">继续扫描</button>
        </div>
        <iframe class="pdf-view" id="pdfView" title="PDF 预览" hidden></iframe>
      </div>
    </div>

    <footer>100% 本地处理 · 无上传云端 · Document Scan MCP</footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="关闭预览">✕</button>
    <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="上一页">‹</button>
    <figure class="lb-stage">
      <img id="lbImg" alt="" />
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="下一页">›</button>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const btnScan = document.getElementById("btnScan");
    const btnClear = document.getElementById("btnClear");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const previewRow = document.getElementById("previewRow");
    const btnDownload = document.getElementById("btnDownload");
    const pageBadge = document.getElementById("pageBadge");
    const modeSeg = document.getElementById("modeSeg");
    const modeBadge = document.getElementById("modeBadge");
    const btnPdf = document.getElementById("btnPdf");
    const pdfView = document.getElementById("pdfView");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbCap = document.getElementById("lbCap");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");

    let selected = []; // {file, url} — append-only until a page is removed
    let mode = "color";
    let busy = false;

    modeSeg.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        modeSeg.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        mode = btn.dataset.mode;
      });
    });

    function setStatus(text, kind) {
      statusEl.className = "status" + (kind ? " " + kind : "");
      statusEl.textContent = text;
    }

    function render() {
      fileList.innerHTML = "";
      selected.forEach((it, i) => {
        const wrap = document.createElement("div");
        wrap.className = "thumb-wrap";
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = it.url;
        img.alt = it.file.name;
        img.title = "点击预览";
        img.addEventListener("click", () => openLb(selected, i));
        const ord = document.createElement("span");
        ord.className = "ord";
        ord.textContent = i + 1;
        wrap.appendChild(img);
        wrap.appendChild(ord);
        fileList.appendChild(wrap);
      });

      const has = selected.length > 0;
      dropzone.classList.toggle("has-files", has);
      btnScan.disabled = busy || !has;
      btnClear.disabled = busy || !has;
      // Adding files must not overwrite "处理中…"/"完成" while a job is running.
      if (!busy) setStatus(has ? `已选 ${selected.length} 张` : "");
    }

    function addFiles(fileListObj) {
      let added = 0;
      Array.from(fileListObj || []).forEach((f) => {
        if (!f.type.startsWith("image/")) return;
        selected.push({ file: f, url: URL.createObjectURL(f) });
        added++;
      });
      render();
      return added;
    }

    function clearAll() {
      selected.forEach((it) => URL.revokeObjectURL(it.url));
      selected = [];
      fileInput.value = "";
      render();
    }

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
    });

    // The <input> is an overlay covering the whole drop zone, so OS drops land on
    // it, not on the zone. Its native drop handling would fire "change" *and*
    // let this event bubble to the zone listener — adding the same file twice.
    // Cancelling the default here leaves exactly one path per drop.
    fileInput.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      // Reset so picking the same file again still fires change.
      fileInput.value = "";
    });

    // Ctrl+V / Cmd+V anywhere on the page: screenshots and copied image files
    // arrive as clipboard items, not as a drop or a file-picker result.
    window.addEventListener("paste", (e) => {
      const dt = e.clipboardData;
      if (!dt) return;
      const files = Array.from(dt.items)
        .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
        .map((it) => {
          const f = it.getAsFile();
          if (!f) return null;
          // A pasted screenshot has no usable name; keep it out of the PDF
          // metadata and the error messages.
          return f.name && f.name !== "image.png"
            ? f
            : new File([f], `clipboard_${Date.now()}.png`, { type: f.type });
        })
        .filter(Boolean);
      if (!files.length) return;
      e.preventDefault();
      addFiles(files);
    });

    btnClear.addEventListener("click", () => {
      clearAll();
      resultEl.classList.remove("show");
      hidePdf();
      pdfUrl = "";
      setStatus("");
    });

    document.getElementById("btnAgain").addEventListener("click", () => {
      btnClear.click();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* ---------- image preview overlay ---------- */

    const MODE_LABELS = { color: "彩色", gray: "灰度", bw: "黑白" };

    let lbList = [];
    let lbIndex = 0;

    function showLb() {
      const it = lbList[lbIndex];
      if (!it) return closeLb();
      lbImg.src = it.url;
      lbImg.alt = it.name || "预览";
      lbCap.textContent =
        (it.name ? it.name + " · " : "") + `第 ${lbIndex + 1} / ${lbList.length} 张`;
      const many = lbList.length > 1;
      lbPrev.hidden = !many;
      lbNext.hidden = !many;
    }

    function openLb(list, i) {
      // Snapshot the entries: the list may change while the overlay is open.
      lbList = Array.from(list).map((it) => ({
        url: it.url,
        name: it.name || (it.file && it.file.name) || "",
      }));
      lbIndex = i;
      lightbox.classList.add("show");
      document.body.style.overflow = "hidden";
      showLb();
    }

    function closeLb() {
      lightbox.classList.remove("show");
      lbImg.removeAttribute("src");
      document.body.style.overflow = "";
    }

    function stepLb(d) {
      if (lbList.length < 2) return;
      lbIndex = (lbIndex + d + lbList.length) % lbList.length;
      showLb();
    }

    document.getElementById("lbClose").addEventListener("click", closeLb);
    lbPrev.addEventListener("click", () => stepLb(-1));
    lbNext.addEventListener("click", () => stepLb(1));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target.classList.contains("lb-stage")) closeLb();
    });
    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("show")) return;
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") stepLb(-1);
      else if (e.key === "ArrowRight") stepLb(1);
    });

    /* ---------- PDF preview ---------- */

    let pdfUrl = "";

    function hidePdf() {
      pdfView.hidden = true;
      pdfView.removeAttribute("src");
      btnPdf.textContent = "预览 PDF";
    }

    btnPdf.addEventListener("click", () => {
      if (!pdfUrl) return;
      if (pdfView.hidden) {
        // ?inline=1 suppresses Content-Disposition so the browser renders the
        // PDF instead of downloading it.
        pdfView.src = pdfUrl + "?inline=1";
        pdfView.hidden = false;
        btnPdf.textContent = "收起 PDF";
      } else {
        hidePdf();
      }
    });

    btnScan.addEventListener("click", async () => {
      if (!selected.length || busy) return;
      busy = true;
      btnScan.disabled = true;
      btnClear.disabled = true;
      statusEl.className = "status working";
      statusEl.innerHTML = '<span class="spinner"></span>处理中…';
      resultEl.classList.remove("show");
      hidePdf();
      pdfUrl = "";

      const fd = new FormData();
      let outcome = null;
      selected.forEach((it) => fd.append("files", it.file, it.file.name));
      fd.append("mode", mode);
      fd.append("auto_crop", document.getElementById("autoCrop").checked ? "true" : "false");
      fd.append("unify_a4", document.getElementById("unifyA4").checked ? "true" : "false");

      try {
        const res = await fetch("/api/scan", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "处理失败");

        previewRow.innerHTML = "";
        const scanned = (data.previews || []).map((url, i) => ({
          url,
          name: `扫描结果 第 ${i + 1} 页`,
        }));
        scanned.forEach((p, i) => {
          const img = document.createElement("img");
          img.src = p.url;
          img.alt = p.name;
          img.title = "点击预览";
          img.addEventListener("click", () => openLb(scanned, i));
          previewRow.appendChild(img);
        });
        pageBadge.textContent = data.pages + " 页";
        // Read the mode back from the response: it reports what the server
        // actually applied, not what the buttons look like.
        modeBadge.textContent = MODE_LABELS[data.mode] || data.mode || "";
        pdfUrl = data.pdf_url;
        btnDownload.href = data.pdf_url;
        btnDownload.setAttribute("download", data.download_name || "scanned.pdf");
        resultEl.classList.add("show");
        outcome = ["完成", "ok"];
        resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        outcome = [err.message || "出错了", "err"];
      } finally {
        busy = false;
        // render() reports the list count; the job result takes the line after.
        render();
        if (outcome) setStatus(outcome[0], outcome[1]);
      }
    });
  </script>
</body>
</html>
