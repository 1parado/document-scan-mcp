<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Document Scan</title>
  <meta name="theme-color" content="#31614f" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="manifest" href="/static/manifest.json" />
  <style>
    :root {
      /* 卡片式布局 + 深苔绿强调色（不用蓝） */
      --bg: #f6f7f5;
      --surface: #ffffff;
      --text: #212623;
      --muted: #79827c;
      --faint: #a4aca6;
      --border: #e4e7e3;
      --hairline: #e8ebe7;
      --accent: #31614f;
      --accent-deep: #27503f;
      --accent-soft: #eef3f0;
      --accent-border: #c3d4cb;
      --danger: #b3402e;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(33,38,35,.04), 0 10px 32px rgba(33,38,35,.07);
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
      height: fit-content;
    }

    /* ---------- header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    header .titles h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header .titles p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 1px;
    }

    header .settings-btn {
      margin-left: auto;
      width: 34px; height: 34px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .15s, color .15s;
    }

    header .settings-btn:hover { background: var(--accent-soft); color: var(--text); }
    header .settings-btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }

    hr.sep {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 20px 0;
    }

    /* ---------- drop zone ---------- */
    .drop {
      position: relative;
      border: 1.5px dashed var(--accent-border);
      border-radius: 12px;
      background: var(--accent-soft);
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s, background .18s, box-shadow .18s;
      overflow: hidden;
    }

    .drop:hover { border-color: var(--accent); }
    .drop.dragover {
      border-color: var(--accent);
      background: #e2ede7;
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .drop.has-files {
      border-style: solid;
      border-color: var(--border);
      background: var(--surface);
      padding: 16px;
    }

    .drop input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon {
      width: 40px; height: 40px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      display: grid;
      place-items: center;
      box-shadow: 0 1px 3px rgba(33,38,35,.08);
      transition: transform .2s;
    }

    .drop:hover .drop-icon { transform: translateY(-2px); }

    .drop h2 {
      font-size: .95rem;
      font-weight: 600;
    }

    .drop .sub {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 3px;
    }

    .drop .pick-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 7px 18px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: .84rem;
      font-weight: 500;
      pointer-events: none;
      transition: background .15s, border-color .15s;
    }

    .drop:hover .pick-btn { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* 处理中：一条细线在拖放区扫过 */
    .drop::after {
      content: "";
      position: absolute;
      left: 10px; right: 10px;
      top: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      pointer-events: none;
    }

    .drop.scanning::after {
      opacity: 1;
      animation: scanline 1.8s cubic-bezier(.4,0,.6,1) infinite;
    }

    /* ---------- 缩略图 ---------- */
    .file-list {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .drop.has-files .file-list { display: flex; }
    .drop.has-files .drop-hint { display: none; }

    .thumb-wrap {
      position: relative;
      animation: settle .35s cubic-bezier(.2,.8,.3,1) both;
      cursor: grab;
    }

    .thumb-wrap.dragging { opacity: .45; cursor: grabbing; }
    .thumb-wrap.drag-over::before {
      content: "";
      position: absolute;
      inset: 0 0 0 -6px;
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      pointer-events: none;
    }

    .thumb {
      display: block;
      width: 74px; height: 96px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: zoom-in;
      transition: transform .15s, box-shadow .15s;
    }

    .thumb:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(33,38,35,.14); }

    /* Word 文档卡片（无图片预览时） */
    .thumb.doc-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--accent);
      background: var(--accent-soft);
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .1em;
      cursor: default;
    }

    .thumb.doc-card:hover { transform: none; box-shadow: none; }

    .thumb-wrap .ord {
      position: absolute;
      top: -5px; left: -5px;
      min-width: 17px; height: 17px;
      padding: 0 4px;
      background: var(--accent);
      color: #fff;
      font-family: var(--mono);
      font-size: 9.5px;
      line-height: 17px;
      text-align: center;
      border-radius: 999px;
    }

    .thumb-wrap .rm {
      position: absolute;
      top: -6px; right: -6px;
      width: 18px; height: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity .15s, color .15s, border-color .15s;
    }

    .thumb-wrap:hover .rm,
    .thumb-wrap .rm:focus-visible { opacity: 1; }
    .thumb-wrap .rm:hover { color: var(--danger); border-color: var(--danger); }

    /* 手动裁剪入口（左上角第二枚角标，序号右侧） */
    .thumb-wrap .crop-entry {
      top: -6px;
      right: auto;
      left: 14px;
      font-size: 11px;
    }
    .thumb-wrap .crop-entry.set {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      opacity: 1;
    }

    /* ---------- 手动裁剪浮层 ---------- */
    .crop-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(23, 27, 25, .92);
      backdrop-filter: blur(3px);
    }
    .crop-overlay.show { display: flex; }

    .crop-stage {
      position: relative;
      max-width: min(92vw, 800px);
      max-height: 62vh;
      touch-action: none;
    }
    .crop-stage img { display: block; max-width: 100%; max-height: 62vh; }

    .crop-quad {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .crop-quad polygon {
      fill: rgba(76, 195, 138, .14);
      stroke: var(--accent);
      stroke-width: 2;
    }
    .crop-handle {
      position: absolute;
      width: 34px; height: 34px;   /* 大触控目标，视觉圆点小 */
      margin: -17px 0 0 -17px;
      display: grid;
      place-items: center;
      cursor: grab;
      touch-action: none;
    }
    .crop-handle::after {
      content: "";
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2.5px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .crop-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .crop-actions .btn { background: #fff; color: var(--text); }
    .crop-actions .btn-primary { background: var(--accent); color: #fff; }
    .crop-hint { color: #9aa5a0; font-size: .8rem; }

    /* ---------- 扫描模式卡片 ---------- */
    .section-label {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      margin: 22px 0 10px;
    }

    .mode-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mode-card {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      padding: 14px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      font-weight: 500;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
    }

    .mode-card:hover { border-color: var(--accent-border); color: var(--text); }

    .mode-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .mode-card svg { display: block; }

    /* ---------- 开关行 ---------- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .toggle-row + .toggle-row { border-top: 1px solid var(--hairline); }

    .toggle-row .t-label { font-size: .88rem; font-weight: 500; }
    .toggle-row .t-hint { display: block; font-size: .74rem; color: var(--faint); font-weight: 400; }

    .toggle-row input {
      appearance: none;
      width: 34px; height: 19px;
      border-radius: 999px;
      background: #d5dad5;
      position: relative;
      cursor: pointer;
      transition: background .18s;
      flex-shrink: 0;
    }

    .toggle-row input::after {
      content: "";
      position: absolute;
      top: 2.5px; left: 2.5px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
      transition: transform .18s cubic-bezier(.3,1.3,.5,1);
    }

    .toggle-row input:checked { background: var(--accent); }
    .toggle-row input:checked::after { transform: translateX(15px); }

    /* ---------- 动作区 ---------- */
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: .9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, color .15s, transform .1s, opacity .15s, box-shadow .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary {
      flex: 1;
      background: var(--text);
      color: var(--surface);
      box-shadow: 0 2px 10px rgba(33,38,35,.18);
    }

    .btn-primary:hover:not(:disabled) {
      background: #000;
      box-shadow: 0 4px 14px rgba(33,38,35,.24);
    }

    .btn-primary .icon-scan { display: inline-block; }
    .btn-primary.working .icon-scan { animation: spin 1.2s linear infinite; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--accent-soft); }

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-family: var(--mono);
      font-size: .74rem;
      letter-spacing: .03em;
      color: var(--muted);
      text-align: center;
      transition: color .2s;
    }

    .status.working { color: var(--accent); }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }

    /* ---------- 结果 ---------- */
    .result {
      display: none;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
    }

    .result.show { display: block; animation: rise .4s cubic-bezier(.2,.8,.3,1) both; }

    .result h3 {
      font-size: .92rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 9px;
      border-radius: 999px;
    }

    #pageBadge { color: var(--text); background: var(--bg); border: 1px solid var(--border); }

    .preview-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 12px;
      margin-bottom: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .preview-row img {
      height: 180px;
      width: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: zoom-in;
      flex-shrink: 0;
      transition: transform .16s, box-shadow .16s;
      animation: settle .4s cubic-bezier(.2,.8,.3,1) both;
    }

    .preview-row img:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(33,38,35,.15); }

    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn-download {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    .btn-download:hover { background: var(--accent-deep); }

    .pdf-view {
      display: block;
      width: 100%;
      height: 64vh;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      animation: rise .3s ease-out both;
    }

    .pdf-view[hidden] { display: none; }

    /* ---------- lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 60px 84px;
      background: rgba(23, 27, 25, .92);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity .18s;
    }

    .lightbox.show { display: flex; }
    .lightbox.visible { opacity: 1; }

    .lb-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
      max-height: 100%;
      transform: scale(.97);
      transition: transform .18s cubic-bezier(.2,.8,.3,1);
    }

    .lightbox.visible .lb-stage { transform: scale(1); }

    .lb-stage img {
      max-width: 100%;
      max-height: calc(100vh - 170px);
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
    }

    .lb-stage figcaption {
      color: #9aa5a0;
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .04em;
    }

    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 64px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #cfd6d2;
      font-size: 24px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .lb-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
    .lb-btn[hidden] { display: none; }
    .lb-prev { left: 14px; }
    .lb-next { right: 14px; }

    .lb-close {
      top: 16px; right: 16px;
      transform: none;
      width: 38px; height: 38px;
      font-size: 15px;
    }

    @media (max-width: 560px) {
      body { padding: 20px 12px calc(24px + env(safe-area-inset-bottom)); }
      .card { padding: 20px 16px 18px; }
      header .logo { width: 34px; height: 34px; }
      header h1 { font-size: 1rem; }
      .drop { padding: 28px 14px; }
      /* 触控目标 ≥44px */
      .thumb { width: 84px; height: 108px; }
      .thumb-wrap .rm { width: 26px; height: 26px; top: -8px; right: -8px; font-size: 12px; opacity: 1; }
      .thumb-wrap .rm::before { content: ""; position: absolute; inset: -10px; }
      .mode-card { padding: 12px 6px 10px; }
      .toggle-row { padding: 12px 0; }
      .btn { padding: 13px 20px; }
      .btn-ghost { min-width: 44px; }
      .actions { gap: 8px; }
      .status { font-size: .7rem; }
      .lightbox { padding: 56px 10px; }
      .lb-btn { width: 34px; height: 50px; font-size: 20px; }
      .lb-prev { left: 6px; }
      .lb-next { right: 6px; }
      /* 手机上手势导航会吃掉左右滑键，lightbox 支持滑动切换 */
      .lb-stage { touch-action: pan-y; }
    }

    footer {
      text-align: center;
      margin-top: 18px;
      color: var(--faint);
      font-size: .72rem;
    }

    /* ---------- 动效 ---------- */
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes scanline {
      0%   { transform: translateY(8px); }
      50%  { transform: translateY(calc(var(--scan-h, 150px) - 8px)); }
      100% { transform: translateY(8px); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes settle {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .drop.scanning::after { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect x="2" y="3.5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 6.5h9M4.5 9h9M4.5 11.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="titles">
        <h1>Document Scan</h1>
        <p>100% 本地处理 · 文件不上传云端</p>
      </div>
      <button type="button" class="settings-btn" id="btnSettings" aria-expanded="false" aria-label="展示更多" title="展示更多">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 5.5h13M2.5 12.5h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="7" cy="5.5" r="2" fill="#fff" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="11.5" cy="12.5" r="2" fill="#fff" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </header>

    <hr class="sep" />

    <div class="drop" id="dropzone">
      <input type="file" id="fileInput" accept="image/*,.docx,.doc,.pdf" />
      <div class="drop-hint">
        <div class="drop-icon">
          <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 3.5v7.5M9 3.5 6 6.5M9 3.5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 11.5v2A1.5 1.5 0 0 0 4.5 15h9a1.5 1.5 0 0 0 1.5-1.5v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h2>拖放文件到此处</h2>
        <p class="sub">选择文件，或直接粘贴截图（Ctrl + V）</p>
        <span class="pick-btn">选择文件</span>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>

    <div id="settings" hidden>
      <div class="section-label">扫描模式</div>
      <div class="mode-cards" id="modeSeg" role="radiogroup" aria-label="扫描模式">
        <button type="button" class="mode-card active" data-mode="color" role="radio" aria-checked="true">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none" aria-hidden="true">
            <circle cx="9.5" cy="9.5" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9.5 2.5a7 7 0 0 1 0 14Z" fill="currentColor" opacity=".35"/>
            <circle cx="9.5" cy="9.5" r="7" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          彩色
        </button>
        <button type="button" class="mode-card" data-mode="gray" role="radio" aria-checked="false">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none" aria-hidden="true">
            <circle cx="9.5" cy="9.5" r="7" fill="currentColor" opacity=".25"/>
            <circle cx="9.5" cy="9.5" r="7" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          灰度
        </button>
        <button type="button" class="mode-card" data-mode="bw" role="radio" aria-checked="false">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none" aria-hidden="true">
            <circle cx="9.5" cy="9.5" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9.5 2.5a7 7 0 0 1 0 14Z" fill="currentColor"/>
          </svg>
          黑白
        </button>
      </div>

      <div class="section-label">选项</div>
      <div class="toggle-row">
        <span>
          <span class="t-label">智能裁边</span>
          <span class="t-hint">自动识别边缘并外扩，保护内容</span>
        </span>
        <input type="checkbox" id="autoCrop" checked aria-label="智能裁边" />
      </div>
      <div class="toggle-row">
        <span>
          <span class="t-label">A4 页面</span>
          <span class="t-hint">所有页统一为 A4 尺寸</span>
        </span>
        <input type="checkbox" id="unifyA4" checked aria-label="统一为 A4 页面" />
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnScan" disabled>
        <span class="icon-scan" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M2 5.5V3.5A1.5 1.5 0 0 1 3.5 2h2M10.5 2h2A1.5 1.5 0 0 1 14 3.5v2M14 10.5v2a1.5 1.5 0 0 1-1.5 1.5h-2M5.5 14h-2A1.5 1.5 0 0 1 2 12.5v-2M2.5 8h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        开始扫描
      </button>
      <button class="btn btn-ghost" id="btnClear" disabled>清空</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="result" id="result">
      <h3>
        处理完成
        <span class="badge" id="pageBadge">0 页</span>
        <span class="badge" id="modeBadge"></span>
      </h3>
      <div class="preview-row" id="previewRow"></div>
      <div class="result-actions">
        <a class="btn btn-download" id="btnDownload" href="#" download>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2.5v8M8 10.5 4.8 7.3M8 10.5l3.2-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.5 12v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          下载 PDF
        </a>
        <button type="button" class="btn btn-ghost" id="btnPdf">预览 PDF</button>
        <button class="btn btn-ghost" id="btnRescan">用当前设置重扫</button>
        <button class="btn btn-ghost" id="btnAgain">继续扫描</button>
      </div>
      <iframe class="pdf-view" id="pdfView" title="PDF 预览" hidden></iframe>
    </div>
  </div>

  <div class="crop-overlay" id="cropOverlay">
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" alt="裁剪" />
      <svg class="crop-quad" id="cropQuad" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon points="0,0 100,0 100,100 0,100" />
      </svg>
      <div class="crop-handle" data-h="0"></div>
      <div class="crop-handle" data-h="1"></div>
      <div class="crop-handle" data-h="2"></div>
      <div class="crop-handle" data-h="3"></div>
    </div>
    <div class="crop-actions">
      <button type="button" class="btn" id="cropCancel">取消</button>
      <button type="button" class="btn btn-primary" id="cropApply">应用并重扫</button>
    </div>
    <p class="crop-hint">拖动四个角点框住文档，应用后按当前设置重新扫描</p>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="关闭预览">✕</button>
    <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="上一页">‹</button>
    <figure class="lb-stage">
      <img id="lbImg" alt="" />
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="下一页">›</button>
  </div>

  <script>
    // PWA: 注册 service worker（仅在 https 或 localhost 下生效）
    if ("serviceWorker" in navigator && location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      navigator.serviceWorker.register("/static/sw.js").catch(() => {});
    }

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const btnScan = document.getElementById("btnScan");
    const btnClear = document.getElementById("btnClear");
    const btnSettings = document.getElementById("btnSettings");
    const settingsEl = document.getElementById("settings");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const previewRow = document.getElementById("previewRow");
    const btnDownload = document.getElementById("btnDownload");
    const pageBadge = document.getElementById("pageBadge");
    const modeSeg = document.getElementById("modeSeg");
    const modeBadge = document.getElementById("modeBadge");
    const btnPdf = document.getElementById("btnPdf");
    const pdfView = document.getElementById("pdfView");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbCap = document.getElementById("lbCap");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");
    const lbCloseBtn = document.getElementById("lbClose");

    let selected = []; // {file, url} — append-only until a page is removed
    let mode = "color";
    let busy = false;

    // 设置默认收起，点击右上按钮展开/收起；悬停提示随状态切换。
    btnSettings.addEventListener("click", () => {
      const open = btnSettings.getAttribute("aria-expanded") === "true";
      btnSettings.setAttribute("aria-expanded", String(!open));
      settingsEl.hidden = open;
      const label = open ? "展示更多" : "收起设置";
      btnSettings.setAttribute("aria-label", label);
      btnSettings.title = label;
    });

    modeSeg.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        modeSeg.querySelectorAll("button").forEach((b) => {
          b.classList.remove("active");
          b.setAttribute("aria-checked", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-checked", "true");
        mode = btn.dataset.mode;
      });
    });

    function setStatus(text, kind) {
      statusEl.className = "status" + (kind ? " " + kind : "");
      statusEl.textContent = text;
    }

    /* 缩略图渲染：全量 render() 仅用于重排/删除/清空；新增走 addThumb()
       增量插入，避免整片重建导致大图闪白、展示变慢。 */
    function makeThumb(it, i) {
      const wrap = document.createElement("div");
      wrap.className = "thumb-wrap";
      wrap.draggable = !it.word;
      wrap.dataset.idx = i;
      const ord = document.createElement("span");
      ord.className = "ord";
      ord.textContent = i + 1;
      // 手动裁剪入口：仅图片项，有手动框时高亮显示。
      if (!it.word && !it.pdf) {
        const ce = document.createElement("button");
        ce.type = "button";
        ce.className = "rm crop-entry" + (it.manual ? " set" : "");
        ce.setAttribute("aria-label", `手动裁剪第 ${i + 1} 张`);
        ce.title = "手动裁剪";
        ce.textContent = "⌗";
        ce.addEventListener("click", (e) => {
          e.stopPropagation();
          openCrop(i);
        });
        wrap.appendChild(ce);
      }
      let media;
      if (it.word || it.pdf) {
        // Word / PDF 文档卡片：没有 blob URL，用文档图标卡片代替图片缩略图。
        media = document.createElement("div");
        media.className = "thumb doc-card";
        media.innerHTML =
          '<svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true">' +
          '<path d="M5 2.5h7L15.5 6v11A1.5 1.5 0 0 1 14 18.5H5A1.5 1.5 0 0 1 3.5 17V4A1.5 1.5 0 0 1 5 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
          '<path d="M12 2.5V6h3.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
          '<path d="M6.5 10h7M6.5 13h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
          `<span>${it.word ? "DOC" : "PDF"}</span>`;
        media.title = (it.word ? "Word 文档" : "PDF 文档") + " · 转为扫描 PDF";
      } else {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = it.url;
        img.alt = it.file.name;
        img.title = "点击预览 · 拖动可调整顺序";
        img.addEventListener("click", () => openLb(selected, [...fileList.children].indexOf(wrap)));
        media = img;
      }
      const rm = document.createElement("button");
      rm.type = "button";
      rm.className = "rm";
      rm.setAttribute("aria-label", `移除第 ${i + 1} 张`);
      rm.title = "移除";
      rm.textContent = "✕";
      rm.addEventListener("click", (e) => {
        e.stopPropagation();
        if (it.url) URL.revokeObjectURL(it.url);
        selected.splice(i, 1);
        render();
      });
      wrap.appendChild(media);
      wrap.appendChild(ord);
      wrap.appendChild(rm);
      return wrap;
    }

    function render() {
      fileList.innerHTML = "";
      selected.forEach((it, i) => {
        const wrap = makeThumb(it, i);
        // 重排/删除时只在全新的节点上播放动画，位置未变的项不重播。
        wrap.style.animationDelay = `${Math.min(i * 35, 280)}ms`;
        fileList.appendChild(wrap);
      });
      syncState();
    }

    function syncState() {
      // 序号随位置即时更新（拖拽落位后不重建节点也要改）。
      [...fileList.children].forEach((wrap, i) => {
        wrap.dataset.idx = i;
        wrap.querySelector(".ord").textContent = i + 1;
      });
      const has = selected.length > 0;
      dropzone.classList.toggle("has-files", has);
      btnScan.disabled = busy || !has;
      btnClear.disabled = busy || !has;
      // Adding files must not overwrite "处理中…"/"完成" while a job is running.
      if (!busy) {
        if (!has) setStatus("");
        else if (selected[0]?.word) setStatus(`Word 文档：${selected[0].file.name}`);
        else if (selected[0]?.pdf) setStatus(`PDF 文档：${selected[0].file.name}`);
        else setStatus(`已选 ${selected.length} 张`);
      }
    }

    const isWordFile = (f) => /\.(docx?|DOCX?)$/.test(f.name);

    /* 离屏降采样：把大图缩成 240px 缩略图 blob，避免全分辨率解码卡主线程。 */
    async function makeSmallThumb(file, maxDim = 240) {
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
        const w = Math.max(1, Math.round(bmp.width * scale));
        const h = Math.max(1, Math.round(bmp.height * scale));
        const cv = new OffscreenCanvas(w, h);
        cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
        bmp.close();
        const blob = await cv.convertToBlob({ type: "image/jpeg", quality: 0.8 });
        return URL.createObjectURL(blob);
      } catch {
        return ""; // 解码失败就保留原图 URL，行为同旧版
      }
    }
    const isPdfFile = (f) => /\.pdf$/i.test(f.name);
    const isDocFile = (f) => isWordFile(f) || isPdfFile(f);
    // 三类输入互斥：images / docx / pdf。kind 用作列表标识与端点选择。
    const fileKind = (f) => (isWordFile(f) ? "word" : isPdfFile(f) ? "pdf" : "image");

    function addFiles(listObj) {
      const incoming = Array.from(listObj || []).filter(
        (f) => f.type.startsWith("image/") || isDocFile(f)
      );
      if (!incoming.length) return 0;

      const currentKind = selected.length ? (selected[0].word ? "word" : selected[0].pdf ? "pdf" : "image") : null;
      const incomingDoc = incoming.find(isDocFile);
      const incomingKind = incomingDoc ? fileKind(incomingDoc) : "image";

      // 互斥：列表已有内容时，另一种类型直接拒绝并提醒；同类型照常追加。
      if (currentKind && incomingKind !== currentKind) {
        const names = { word: "Word 文档", pdf: "PDF 文档", image: "图片" };
        flashStatus(`已有${names[currentKind]}，${names[incomingKind]}不能与之混传，请先清空`, "err");
        return 0;
      }

      if (incomingDoc) {
        // 文档一次一份：替换列表。
        clearAll();
        const kind = fileKind(incomingDoc);
        selected.push({
          file: incomingDoc,
          url: "",
          word: kind === "word",
          pdf: kind === "pdf",
        });
        render();
        return 1;
      }

      let added = 0;
      incoming.forEach((f) => {
        const it = { file: f, url: URL.createObjectURL(f) };
        selected.push(it);
        // 缩略图不直接吃原图 blob（8MB 手机照解码慢、占内存），降采样到
        // 240px 的 blob 再显示；lightbox 仍用原图 URL。
        makeSmallThumb(f).then((smallUrl) => {
          const img = fileList.children[selected.indexOf(it)]?.querySelector("img.thumb");
          if (img && selected.includes(it)) img.src = smallUrl;
          else URL.revokeObjectURL(smallUrl);
        });
        // 增量插入：只对新增的缩略图添加动画。
        const wrap = makeThumb(it, selected.length - 1);
        fileList.appendChild(wrap);
        added++;
      });
      if (added && selected.length === added) flashStatus(`已添加 ${added} 张`, "ok");
      else if (added) flashStatus(`已添加 ${added} 张`);
      // 接近页数上限时预警（上限 40 由服务端定）。
      if (selected.length >= 35 && selected.length < 40) {
        flashStatus(`已选 ${selected.length} 张，接近 40 页上限`, "err");
      } else if (selected.length >= 40) {
        flashStatus("已达 40 页上限，多余的图片会被服务端拒绝", "err");
      }
      syncState();
      return added;
    }

    /* ---------- 手动裁剪框 ---------- */
    /* 图片项记录手动四角（原图像素坐标，TL/TR/BR/BL）；重扫时随文件发送。 */

    let cropIdx = -1;             // 正在编辑的 selected 下标
    let cropPts = [];             // 显示坐标系下的 4 点
    let cropDrag = -1;
    let cropImgSize = { w: 1, h: 1 };

    const cropOverlay = document.getElementById("cropOverlay");
    const cropImg = document.getElementById("cropImg");
    const cropQuadPoly = document.querySelector("#cropQuad polygon");
    const cropHandles = [...document.querySelectorAll(".crop-handle")];

    function openCrop(i) {
      const it = selected[i];
      if (!it || it.word || it.pdf) return;
      cropIdx = i;
      cropImg.src = it.url;
      cropOverlay.classList.add("show");
      document.body.style.overflow = "hidden";
      // 初始框：80% 居中
      cropImg.onload = () => {
        cropImgSize = { w: cropImg.naturalWidth, h: cropImg.naturalHeight };
        const r = cropImg.getBoundingClientRect();
        cropPts = [
          [r.width * .1, r.height * .1], [r.width * .9, r.height * .1],
          [r.width * .9, r.height * .9], [r.width * .1, r.height * .9],
        ];
        // 已有手动框则恢复
        if (it.manual) {
          cropPts = it.manual.map(([x, y]) => [
            x / cropImgSize.w * r.width, y / cropImgSize.h * r.height,
          ]);
        }
        drawCrop();
      };
      if (cropImg.complete) cropImg.onload();
    }

    function drawCrop() {
      cropQuadPoly.setAttribute("points", cropPts.map((p) => p.join(",")).join(" "));
      cropHandles.forEach((h, i) => {
        h.style.left = cropPts[i][0] + "px";
        h.style.top = cropPts[i][1] + "px";
      });
    }

    function stagePoint(e) {
      const r = cropImg.getBoundingClientRect();
      return [
        Math.max(0, Math.min(r.width, e.clientX - r.left)),
        Math.max(0, Math.min(r.height, e.clientY - r.top)),
      ];
    }

    function handlePos(e) {
      // 支持鼠标和触摸
      if (e.touches?.length) return [e.touches[0].clientX, e.touches[0].clientY];
      return [e.clientX, e.clientY];
    }

    function onHandleDown(e) {
      cropDrag = +e.currentTarget.dataset.h;
      e.preventDefault();
    }

    function onMove(e) {
      if (cropDrag < 0) return;
      const [x, y] = handlePos(e);
      const r = cropImg.getBoundingClientRect();
      cropPts[cropDrag] = [
        Math.max(0, Math.min(r.width, x - r.left)),
        Math.max(0, Math.min(r.height, y - r.top)),
      ];
      drawCrop();
      if (e.cancelable) e.preventDefault();
    }

    function onUp() { cropDrag = -1; }

    cropHandles.forEach((h) => {
      h.addEventListener("mousedown", onHandleDown);
      h.addEventListener("touchstart", onHandleDown, { passive: false });
    });
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchend", onUp);

    document.getElementById("cropCancel").addEventListener("click", () => {
      cropOverlay.classList.remove("show");
      document.body.style.overflow = "";
      cropIdx = -1;
    });

    document.getElementById("cropApply").addEventListener("click", () => {
      if (cropIdx < 0) return;
      const it = selected[cropIdx];
      const r = cropImg.getBoundingClientRect();
      // 显示坐标 → 原图像素坐标
      it.manual = cropPts.map(([x, y]) => [
        Math.round(x / r.width * cropImgSize.w),
        Math.round(y / r.height * cropImgSize.h),
      ]);
      cropOverlay.classList.remove("show");
      document.body.style.overflow = "";
      cropIdx = -1;
      flashStatus("已应用手动裁剪，正在重新扫描", "ok");
      if (!busy) btnScan.click();
    });

    /* 临时错误提醒：3 秒后恢复为常规状态行。 */
    let flashTimer = 0;
    function flashStatus(text, kind) {
      clearTimeout(flashTimer);
      setStatus(text, kind);
      flashTimer = setTimeout(() => {
        if (!busy) syncState();
      }, 3000);
    }

    /* ---------- 缩略图拖拽排序 ---------- */

    let dragIdx = -1;

    fileList.addEventListener("dragstart", (e) => {
      const wrap = e.target.closest(".thumb-wrap");
      if (!wrap) return;
      dragIdx = +wrap.dataset.idx;
      wrap.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      // 必须setData，Firefox 才会启动拖拽。
      e.dataTransfer.setData("text/plain", String(dragIdx));
    });

    fileList.addEventListener("dragend", () => {
      dragIdx = -1;
      fileList.querySelectorAll(".thumb-wrap").forEach((w) =>
        w.classList.remove("dragging", "drag-over")
      );
    });

    fileList.addEventListener("dragover", (e) => {
      if (dragIdx < 0) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const wrap = e.target.closest(".thumb-wrap");
      fileList.querySelectorAll(".thumb-wrap").forEach((w) => w.classList.remove("drag-over"));
      if (wrap && +wrap.dataset.idx !== dragIdx) wrap.classList.add("drag-over");
    });

    fileList.addEventListener("dragleave", (e) => {
      const wrap = e.target.closest?.(".thumb-wrap");
      if (wrap) wrap.classList.remove("drag-over");
    });

    fileList.addEventListener("drop", (e) => {
      if (dragIdx < 0) return;
      e.preventDefault();
      e.stopPropagation(); // 不要触发外层 dropzone 的"添加文件"
      const wrap = e.target.closest(".thumb-wrap");
      if (!wrap) return;
      const to = +wrap.dataset.idx;
      if (to === dragIdx) return;
      const [moved] = selected.splice(dragIdx, 1);
      selected.splice(to, 0, moved);
      // 先插到目标位置再移除旧节点：顺序保持，DOM 不整体重建。
      const node = fileList.children[dragIdx];
      const ref = fileList.children[to > dragIdx ? to + 1 : to];
      fileList.insertBefore(node, ref || null);
      dragIdx = -1;
      fileList.querySelectorAll(".thumb-wrap").forEach((w) =>
        w.classList.remove("dragging", "drag-over")
      );
      syncState();
    });

    function clearAll() {
      selected.forEach((it) => URL.revokeObjectURL(it.url));
      selected = [];
      fileInput.value = "";
      render();
    }

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
    });

    // The <input> is an overlay covering the whole drop zone, so OS drops land on
    // it, not on the zone. Its native drop handling would fire "change" *and*
    // let this event bubble to the zone listener — adding the same file twice.
    // Cancelling the default here leaves exactly one path per drop.
    fileInput.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      // Reset so picking the same file again still fires change.
      fileInput.value = "";
    });

    // Ctrl+V / Cmd+V anywhere on the page: screenshots and copied image files
    // arrive as clipboard items, not as a drop or a file-picker result.
    window.addEventListener("paste", (e) => {
      const dt = e.clipboardData;
      if (!dt) return;
      const files = Array.from(dt.items)
        .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
        .map((it) => {
          const f = it.getAsFile();
          if (!f) return null;
          // A pasted screenshot has no usable name; keep it out of the PDF
          // metadata and the error messages.
          return f.name && f.name !== "image.png"
            ? f
            : new File([f], `clipboard_${Date.now()}.png`, { type: f.type });
        })
        .filter(Boolean);
      if (!files.length) return;
      e.preventDefault();
      addFiles(files);
    });

    btnClear.addEventListener("click", () => {
      clearAll();
      resultEl.classList.remove("show");
      hidePdf();
      pdfUrl = "";
      setStatus("");
    });

    // 重扫：文件列表还在（btnAgain 之外的路径不清空 selected），换设置后
    // 直接再跑一遍同一个 handler。
    document.getElementById("btnRescan").addEventListener("click", () => {
      if (busy || !selected.length) return;
      window.scrollTo({ top: 0, behavior: "smooth" });
      btnScan.click();
    });

    document.getElementById("btnAgain").addEventListener("click", () => {
      btnClear.click();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* ---------- image preview overlay ---------- */

    const MODE_LABELS = { color: "彩色", gray: "灰度", bw: "黑白" };

    let lbList = [];
    let lbIndex = 0;

    function showLb() {
      const it = lbList[lbIndex];
      if (!it) return closeLb();
      lbImg.src = it.url;
      lbImg.alt = it.name || "预览";
      lbCap.textContent =
        (it.name ? it.name + " · " : "") + `${lbIndex + 1} / ${lbList.length}`;
      const many = lbList.length > 1;
      lbPrev.hidden = !many;
      lbNext.hidden = !many;
    }

    function openLb(list, i) {
      // Snapshot the entries: the list may change while the overlay is open.
      lbList = Array.from(list).map((it) => ({
        url: it.url,
        name: it.name || (it.file && it.file.name) || "",
      }));
      lbIndex = i;
      lightbox.classList.add("show");
      // Double rAF so display:flex paints before the opacity transition runs.
      requestAnimationFrame(() =>
        requestAnimationFrame(() => lightbox.classList.add("visible"))
      );
      document.body.style.overflow = "hidden";
      showLb();
      lbCloseBtn.focus();
    }

    function closeLb() {
      lightbox.classList.remove("visible");
      setTimeout(() => {
        lightbox.classList.remove("show");
        lbImg.removeAttribute("src");
      }, 180);
      document.body.style.overflow = "";
    }

    function stepLb(d) {
      if (lbList.length < 2) return;
      lbIndex = (lbIndex + d + lbList.length) % lbList.length;
      showLb();
    }

    lbCloseBtn.addEventListener("click", closeLb);
    lbPrev.addEventListener("click", () => stepLb(-1));
    lbNext.addEventListener("click", () => stepLb(1));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target.classList.contains("lb-stage")) closeLb();
    });
    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("show")) return;
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") stepLb(-1);
      else if (e.key === "ArrowRight") stepLb(1);
    });

    // 手机上左右滑动切换 lightbox 页面。
    let touchX = null;
    lightbox.addEventListener("touchstart", (e) => {
      touchX = e.touches[0].clientX;
    }, { passive: true });
    lightbox.addEventListener("touchend", (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 48) stepLb(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* ---------- PDF preview ---------- */

    let pdfUrl = "";

    function hidePdf() {
      pdfView.hidden = true;
      pdfView.removeAttribute("src");
      btnPdf.textContent = "预览 PDF";
    }

    btnPdf.addEventListener("click", () => {
      if (!pdfUrl) return;
      if (pdfView.hidden) {
        // ?inline=1 suppresses Content-Disposition so the browser renders the
        // PDF instead of downloading it.
        pdfView.src = pdfUrl + "?inline=1";
        pdfView.hidden = false;
        btnPdf.textContent = "收起 PDF";
      } else {
        hidePdf();
      }
    });

    btnScan.addEventListener("click", async () => {
      if (!selected.length || busy) return;
      busy = true;
      btnScan.disabled = true;
      btnClear.disabled = true;
      btnScan.classList.add("working");
      btnScan.lastChild.textContent = " 扫描中…";
      statusEl.className = "status working";
      statusEl.textContent = "正在处理";
      // 一条细线在拖放区来回扫过 —— 处理中的全部表达。
      dropzone.classList.add("scanning");
      dropzone.style.setProperty("--scan-h", dropzone.offsetHeight + "px");
      resultEl.classList.remove("show");
      hidePdf();
      pdfUrl = "";

      const kind = selected[0]?.word ? "word" : selected[0]?.pdf ? "pdf" : "image";
      const endpoint = kind === "word" ? "/api/word2pdf" : kind === "pdf" ? "/api/pdf2scan" : "/api/scan";
      let outcome = null;

      try {
        previewRow.innerHTML = "";
        const scanned = [];

        const appendPreview = (p) => {
          scanned.push(p);
          const img = document.createElement("img");
          img.src = p.url;
          img.alt = p.name;
          img.title = "点击预览";
          img.loading = "lazy";
          img.addEventListener("click", () => openLb(scanned, scanned.indexOf(p)));
          previewRow.appendChild(img);
        };

        let data;
        if (kind === "image") {
          // 流式：/api/scan/stream 每页完成即推一行，首页上墙时后续页还在算。
          const fd = new FormData();
          selected.forEach((it) => {
            fd.append("files", it.file, it.file.name);
            fd.append("corners", it.manual ? JSON.stringify(it.manual) : "");
          });
          fd.append("mode", mode);
          fd.append("auto_crop", document.getElementById("autoCrop").checked ? "true" : "false");
          fd.append("unify_a4", document.getElementById("unifyA4").checked ? "true" : "false");

          const res = await fetch("/api/scan/stream", { method: "POST", body: fd });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "处理失败");
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          const total = selected.length;
          let done = 0;
          let firstShown = false;
          while (true) {
            const { value, done: eof } = await reader.read();
            if (eof) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, nl).trim();
              buf = buf.slice(nl + 1);
              if (!line) continue;
              const evt = JSON.parse(line);
              if (evt.error) throw new Error(evt.error);
              if (evt.type === "page") {
                done++;
                setStatus(`处理中 ${done}/${total}`, "working");
                appendPreview({ url: evt.preview, name: `扫描结果 第 ${evt.index + 1} 页` });
                if (!firstShown) {
                  firstShown = true;
                  pageBadge.textContent = `${done} 页…`;
                  modeBadge.textContent = MODE_LABELS[evt.mode] || evt.mode || "";
                  resultEl.classList.add("show");
                  resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
                }
              } else if (evt.type === "done") {
                data = evt;
              }
            }
          }
          if (!data) throw new Error("连接中断");
          // PDF 就绪前禁用下载按钮，避免下到空链接。
          if (data.pdf_url) {
            pdfUrl = data.pdf_url;
            btnDownload.href = data.pdf_url;
            btnDownload.setAttribute("download", data.download_name || "scanned.pdf");
          }
          const crop = data.crop_status || [];
          const misses = crop.filter((s) => s === "not_found").length;
          if (misses === crop.length && crop.length > 0) {
            outcome = ["完成 ✓ · 未检测到文档边缘，已按原图处理", "err"];
          } else if (misses > 0) {
            outcome = [`完成 ✓ · ${crop.length - misses}/${crop.length} 页已裁边`, "ok"];
          } else {
            outcome = ["完成 ✓", "ok"];
          }
          busy = false;
          dropzone.classList.remove("scanning");
          btnScan.classList.remove("working");
          btnScan.lastChild.textContent = " 开始扫描";
          render();
          setStatus(outcome[0], outcome[1]);
          return;
        }

        const fd = new FormData();
        if (kind === "word") fd.append("word", selected[0].file, selected[0].file.name);
        else fd.append("pdf", selected[0].file, selected[0].file.name);
        const res = await fetch(endpoint, { method: "POST", body: fd });
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "处理失败");
        (data.previews || []).forEach((url, j) =>
          appendPreview({ url, name: `扫描结果 第 ${j + 1} 页` })
        );

        pageBadge.textContent = data.pages + " 页";
        // Read the mode back from the response: it reports what the server
        // applied, not what the buttons look like. Document jobs return "gray".
        modeBadge.textContent =
          kind === "word" ? "Word 转换" : kind === "pdf" ? "PDF 转换" : MODE_LABELS[data.mode] || data.mode || "";
        pdfUrl = data.pdf_url;
        btnDownload.href = data.pdf_url;
        btnDownload.setAttribute("download", data.download_name || "scanned.pdf");
        resultEl.classList.add("show");
        resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        outcome = ["完成 ✓"];
      } catch (err) {
        outcome = [err.message || "出错了", "err"];
      } finally {
        busy = false;
        dropzone.classList.remove("scanning");
        btnScan.classList.remove("working");
        btnScan.lastChild.textContent = " 开始扫描";
        // render() reports the list count; the job result takes the line after.
        render();
        if (outcome) setStatus(outcome[0], outcome[1] || "ok");
      }
    });
  </script>
</body>
</html>
