<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Document Scan app icon: document sheet + scan frame + lamp line -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8f63"/>
      <stop offset="1" stop-color="#31614f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- document sheet, slightly tilted like a photo being scanned -->
  <g transform="rotate(-6 256 268)">
    <rect x="156" y="128" width="200" height="264" rx="18" fill="#f7f6f2"/>
    <rect x="188" y="176" width="104" height="14" rx="7" fill="#9fb8a9"/>
    <rect x="188" y="212" width="136" height="10" rx="5" fill="#d8d5cd"/>
    <rect x="188" y="238" width="118" height="10" rx="5" fill="#d8d5cd"/>
    <rect x="188" y="264" width="130" height="10" rx="5" fill="#d8d5cd"/>
    <rect x="188" y="290" width="86" height="10" rx="5" fill="#d8d5cd"/>
  </g>
  <!-- scan frame corners -->
  <g stroke="#c9f0db" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M96 168 v-40 a16 16 0 0 1 16 -16 h40"/>
    <path d="M416 168 v-40 a16 16 0 0 0 -16 -16 h-40"/>
    <path d="M96 344 v40 a16 16 0 0 0 16 16 h40"/>
    <path d="M416 344 v40 a16 16 0 0 1 -16 16 h-40"/>
  </g>
  <!-- scan lamp line -->
  <rect x="120" y="250" width="272" height="10" rx="5" fill="#7be6b0"/>
  <rect x="120" y="248" width="272" height="14" rx="7" fill="#7be6b0" opacity=".45"/>
</svg>
